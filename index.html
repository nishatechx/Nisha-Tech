    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#FFFFFF', 
              surface: '#F8FAFC',
              primary: '#0B3C8A', // Deep Academic Blue
              secondary: '#1F3C88', // Secondary Blue
              accent: '#F97316', // Accent Orange
              success: '#22C55E', // Success Green
              dark: '#111827', // Primary Text
              muted: '#6B7280', // Secondary Text
              border: '#E2E8F0',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Outfit', 'sans-serif'],
            },
            backgroundImage: {
              'hero-gradient': 'linear-gradient(135deg, #0B3C8A 0%, #1F3C88 100%)',
            },
            boxShadow: {
              'card': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)',
              'hover': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
            }
          },
        },
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        background-color: #FFFFFF;
        color: #111827;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      
      .section-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 2rem;
      }

      .card-professional {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        padding: 2.5rem;
        border-radius: 1rem;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .card-professional:hover {
        transform: translateY(-5px);
        border-color: #F97316;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
      }

      .btn-hover-effect {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .btn-hover-effect:hover {
        transform: scale(1.03);
      }

      .btn-primary {
        background-color: #1F3C88;
        color: white;
        padding: 0.75rem 1.5rem;
        font-weight: 500;
        transition: background-color 0.2s;
      }

      .btn-primary:hover {
        background-color: #0B3C8A;
      }

      /* 3D Helpers */
      .preserve-3d {
        transform-style: preserve-3d;
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      .perspective-2000 {
        perspective: 2000px;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      
      /* Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #F1F5F9; }
      ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #0B3C8A; }
    </style>
